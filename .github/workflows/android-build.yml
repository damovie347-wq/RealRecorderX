name: Android Build

# Push -> this workflow runs on GitHub's own hosted runners -> a debug APK
# comes out the other end as a downloadable Actions Artifact. No external
# CI service, no self-hosted runner, nothing beyond what GitHub provides.
on:
  push:
  workflow_dispatch:

env:
  # Single source of truth for the Gradle version used everywhere below --
  # keep this in sync with gradle/wrapper/gradle-wrapper.properties.
  GRADLE_VERSION: "9.5.0"
  JAVA_VERSION: "17"
  ANDROID_PLATFORM: "android-37"
  ANDROID_BUILD_TOOLS: "36.0.0"

jobs:
  debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Provisions a real `gradle` binary on PATH -- used below to *generate*
      # the Gradle Wrapper fresh on every run. See "Why no committed
      # gradlew/gradle-wrapper.jar" in README.md: a hand-authored binary
      # wrapper jar can't be safely produced outside a real Gradle install,
      # so instead of committing a possibly-stale/broken one, the workflow
      # regenerates a correct, version-matched wrapper every single run.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }} --distribution-type all

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Install Android SDK components
        run: |
          if command -v sdkmanager &> /dev/null; then
            SDKMANAGER="sdkmanager"
          else
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;${{ env.ANDROID_PLATFORM }}" "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" "platform-tools"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecorderX-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Build release APK (optional)
    runs-on: ubuntu-latest
    # Runs for manual dispatches and for pushes to main -- comment out the
    # `if:` line entirely if you want a release build on every push too.
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }} --distribution-type all

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Install Android SDK components
        run: |
          if command -v sdkmanager &> /dev/null; then
            SDKMANAGER="sdkmanager"
          else
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;${{ env.ANDROID_PLATFORM }}" "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" "platform-tools"

      # Signing material comes ONLY from GitHub Secrets, decoded into a
      # gitignored file that never leaves this runner. If RELEASE_KEYSTORE_BASE64
      # isn't configured, this step is skipped and app/build.gradle.kts falls
      # back to debug signing automatically -- the build still succeeds and
      # still produces an installable (if not Play-Store-ready) APK.
      - name: Decode release keystore
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          HAS_SIGNING: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build release APK
        env:
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecorderX-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Clean up decoded keystore
        if: always()
        run: rm -f release.keystore
