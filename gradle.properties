# Gradle daemon JVM heap. Keep modest -- this is a small single-module app,
# a huge heap only slows CI runners down for no benefit.
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8

# Parallel module builds + build cache. RecorderX only has one module today,
# but these are harmless and pay off the moment a second module is added.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Required by AGP.
android.useAndroidX=true

# Smaller / faster: each module's R class only contains resources it actually
# owns instead of the full transitive tree. One less thing bloating the APK.
android.nonTransitiveRClass=true

# We ship exactly one build variant flavor-wise, so disable BuildConfig
# generation unless a module explicitly asks for it (set per-module instead).
android.defaults.buildfeatures.buildconfig=false
